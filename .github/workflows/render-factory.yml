name: Cloud Video Factory

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Client slug or 'all'"
        required: false
        default: 'tekviyo'
        type: string
      force_rerender:
        description: 'Force re-render even if output already exists on Google Drive'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'clients/**/batch.json'

jobs:
  plan:
    name: Plan Render Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build job matrix
        id: plan
        run: node scripts/plan-matrix.mjs "${{ inputs.client || 'all' }}"

  render:
    name: Render ${{ matrix.slug }} / ${{ matrix.videoId }}
    needs: plan
    if: needs.plan.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Ensure Remotion headless browser
        run: npx remotion browser ensure

      - name: Install and configure rclone
        env:
          RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONF_BASE64 }}
        run: |
          if ! command -v rclone >/dev/null 2>&1; then
            curl -fsSL https://rclone.org/install.sh | sudo bash
          fi

          if [ -n "$RCLONE_CONF_BASE64" ]; then
            mkdir -p ~/.config/rclone
            printf '%s' "$RCLONE_CONF_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf
            chmod 600 ~/.config/rclone/rclone.conf
            echo "DRIVE_ENABLED=true" >> "$GITHUB_ENV"
            echo "Google Drive sync enabled via rclone."
          else
            echo "DRIVE_ENABLED=false" >> "$GITHUB_ENV"
            echo "RCLONE_CONF_BASE64 not set; skipping Google Drive sync."
          fi

      - name: Check existing output on Google Drive
        if: env.DRIVE_ENABLED == 'true' && inputs.force_rerender != true && inputs.force_rerender != 'true'
        env:
          SLUG: ${{ matrix.slug }}
          VIDEO_ID: ${{ matrix.videoId }}
        run: |
          EXISTING=$(rclone lsf "gdrive:Video-Factory/output/${SLUG}/${VIDEO_ID}.mp4" 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "Found existing render on Google Drive: gdrive:Video-Factory/output/${SLUG}/${VIDEO_ID}.mp4"
            echo "SKIP_VIDEO=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_VIDEO=false" >> "$GITHUB_ENV"
          fi

      - name: Pull client media assets from Google Drive
        if: env.DRIVE_ENABLED == 'true' && env.SKIP_VIDEO != 'true'
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          rclone copy "gdrive:Video-Factory/clients/${SLUG}" "./clients/${SLUG}" --exclude "*.json" || true

      - name: Ensure fallback procedural BGM and transition SFX
        if: env.SKIP_VIDEO != 'true'
        run: python3 scripts/ensure-sfx.py "${{ matrix.slug }}" "${{ matrix.videoId }}"

      - name: Check whether Faster-Whisper transcription is required
        id: whisper_check
        if: env.SKIP_VIDEO != 'true'
        env:
          SLUG: ${{ matrix.slug }}
          VIDEO_ID: ${{ matrix.videoId }}
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const slug = process.env.SLUG;
            const videoId = process.env.VIDEO_ID;
            const batchPath = path.join("clients", slug, "batch.json");
            const batch = JSON.parse(fs.readFileSync(batchPath, "utf8"));
            const job = (batch.videos || []).find((v) => v && v.id === videoId);
            const captionsEnabled = Boolean(job && job.captions && job.captions.enabled === true);
            const rawVoice = job && job.audio && typeof job.audio.voicePath === "string"
              ? job.audio.voicePath.replace(/\\/g, "/").replace(/^\.\/+/, "").replace(/^\/+/, "")
              : "";
            const fullVoicePath = rawVoice ? path.join("clients", slug, rawVoice) : "";
            const voiceExists = Boolean(fullVoicePath && fs.existsSync(fullVoicePath) && fs.statSync(fullVoicePath).isFile());
            const shouldTranscribe = captionsEnabled && voiceExists;
            const language = (job && job.captions && job.captions.language) || (batch.settings && batch.settings.defaultLanguage) || "";
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `should_transcribe=${shouldTranscribe ? "true" : "false"}\n` +
              `voice_file=${fullVoicePath}\n` +
              `language=${language}\n`
            );
            console.log(`Whisper check for ${slug}/${videoId}: captionsEnabled=${captionsEnabled}, voiceExists=${voiceExists}, shouldTranscribe=${shouldTranscribe}`);
          '

      - name: Setup Python for Faster-Whisper
        if: env.SKIP_VIDEO != 'true' && steps.whisper_check.outputs.should_transcribe == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Faster-Whisper and generate word-level captions
        if: env.SKIP_VIDEO != 'true' && steps.whisper_check.outputs.should_transcribe == 'true'
        env:
          SLUG: ${{ matrix.slug }}
          VIDEO_ID: ${{ matrix.videoId }}
          VOICE_FILE: ${{ steps.whisper_check.outputs.voice_file }}
          CAPTION_LANG: ${{ steps.whisper_check.outputs.language }}
        run: |
          pip install faster-whisper
          python3 scripts/transcribe.py "${VOICE_FILE}" "clients/${SLUG}/audio/${VIDEO_ID}.captions.json" "${CAPTION_LANG}"

      - name: Render video with Remotion
        if: env.SKIP_VIDEO != 'true'
        run: node scripts/render-one.mjs "${{ matrix.slug }}" "${{ matrix.videoId }}"

      - name: Upload rendered outputs to Google Drive
        if: env.SKIP_VIDEO != 'true' && env.DRIVE_ENABLED == 'true'
        env:
          SLUG: ${{ matrix.slug }}
          VIDEO_ID: ${{ matrix.videoId }}
        run: |
          rclone copy "output/${SLUG}" "gdrive:Video-Factory/output/${SLUG}" --include "${VIDEO_ID}.*"

      - name: Upload GitHub Workflow Artifact
        if: env.SKIP_VIDEO != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.slug }}-${{ matrix.videoId }}
          path: output/${{ matrix.slug }}/${{ matrix.videoId }}.*
          retention-days: 3
          if-no-files-found: error

      - name: Send Telegram alert (optional)
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SLUG: ${{ matrix.slug }}
          VIDEO_ID: ${{ matrix.videoId }}
          JOB_STATUS: ${{ job.status }}
          SKIP_VIDEO: ${{ env.SKIP_VIDEO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram secrets not configured; skipping notification."
            exit 0
          fi

          if [ "$SKIP_VIDEO" = "true" ]; then
            STATUS_TEXT="SKIPPED (already on Drive)"
          elif [ "$JOB_STATUS" = "success" ]; then
            STATUS_TEXT="COMPLETED"
          else
            STATUS_TEXT="FAILED (${JOB_STATUS})"
          fi

          MESSAGE=$(printf 'VideoFactory [%s]\nClient: %s\nVideo: %s\nRun: %s' \
            "$STATUS_TEXT" "$SLUG" "$VIDEO_ID" "$RUN_URL")

          curl -fsS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" >/dev/null || true
